version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: studybuddy_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: studybuddy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: studybuddy_server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/studybuddy
      - JWT_SECRET=dev_secret_studybuddy_jwt_key_12345
      - NODE_ENV=production
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: studybuddy_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
    driver: local
