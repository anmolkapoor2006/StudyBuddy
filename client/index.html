    <!-- Pre-paint Theme & Skin Init (Prevents FOUC & Migrates Legacy Storage) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("studybuddy_theme");
          var savedSkin = localStorage.getItem("studybuddy_skin");

          // Migration: legacy 3-way theme value "web" -> theme "dark" + skin "web"
          if (savedTheme === "web") {
            savedTheme = "dark";
            savedSkin = "web";
            localStorage.setItem("studybuddy_theme", "dark");
            localStorage.setItem("studybuddy_skin", "web");
          } else if (!savedSkin) {
            savedSkin = "web";
            localStorage.setItem("studybuddy_skin", "web");
          }

          var theme = savedTheme === "light" ? "light" : "dark";
          var skin = savedSkin === "basic" ? "basic" : "web";

          var root = document.documentElement;
          root.classList.remove("light", "dark", "theme-web");
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-skin", skin);
        } catch (e) {}
      })();
    </script>
